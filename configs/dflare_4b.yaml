target_model: "Qwen/Qwen3-4B"
draft_checkpoint: "z-lab/Qwen3-4B-DFlash-b16"
data_path: "/checkpoints/sdd/sdd_100k.jsonl"

# DFlare-specific: adaptive layer fusion + heterogeneous KV + progressive gamma.
# Training params (epochs, batch, anchors) match base_4b.yaml for fair comparison.
dflare:
  hidden_size: 2560
  num_draft_layers: 7
  num_target_layers: 9
  gamma_initial: 4.5
  gamma_increment_per_epoch: 1.0

training:
  lr: 6.0e-4
  weight_decay: 0.01
  num_epochs: 3
  batch_size: 4
  gradient_accumulation_steps: 8
  max_seq_len: 3072
  block_size: 16
  max_num_anchors: 128
  warmup_ratio: 0.04
  grad_clip: 1.0
  loss_gamma: 7.0

checkpointing:
  save_every_steps: 500
  save_dir: "/checkpoints/dflare-qwen3-4b"
  keep_last_n: 3

logging:
  wandb_project: "dflare-qwen3-4b"
  log_every_steps: 50
