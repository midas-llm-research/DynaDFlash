target_model: "Qwen/Qwen3-4B"
draft_checkpoint: "z-lab/Qwen3-4B-DFlash-b16"
data_path: "/checkpoints/sdd/sdd_100k.jsonl"

# Commit-and-refine: stage 1 is plain DFlash and emits slots 1..commit; a narrow stage 2
# refines the rest conditioned on those committed tokens. Training block is byte-identical
# to base_4b.yaml so this is directly comparable to the base arm.
commit_refine:
  commit: 3
  refine_layers: 2
  refine_intermediate: 2048

training:
  lr: 6.0e-4
  weight_decay: 0.01
  num_epochs: 3
  batch_size: 4
  gradient_accumulation_steps: 8
  max_seq_len: 3072
  block_size: 16
  max_num_anchors: 128
  warmup_ratio: 0.04
  grad_clip: 1.0
  loss_gamma: 7.0

checkpointing:
  save_every_steps: 500
  save_dir: "/checkpoints/midas-commit-refine-v1"
  keep_last_n: 3

logging:
  wandb_project: "midas-commit-refine"
  log_every_steps: 50
