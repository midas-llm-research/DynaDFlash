target_model: "Qwen/Qwen3-4B"
draft_checkpoint: "z-lab/Qwen3-4B-DFlash-b16"
data_path: "/checkpoints/sdd/sdd_100k.jsonl"

# DFlash 2: path selector + block-local dynamic convolution on the DFlash base.
# Architecture is otherwise plain DFlash (5 layers, 5 target layers, bidirectional
# within-block). Training block is byte-identical to base_4b.yaml so this is
# directly comparable to the baseline checkpoint.
dflash2:
  selector_rank: 256
  selector_top_k: 16
  conv_kernel_size: 2
  conv_group_size: 16
  lambda_selector: 1.0

training:
  lr: 6.0e-4
  weight_decay: 0.01
  num_epochs: 3
  batch_size: 4
  gradient_accumulation_steps: 8
  max_seq_len: 3072
  block_size: 16
  max_num_anchors: 128
  warmup_ratio: 0.04
  grad_clip: 1.0
  loss_gamma: 7.0

checkpointing:
  save_every_steps: 500
  save_dir: "/checkpoints/midas-dflash2-v1"
  keep_last_n: 3

logging:
  wandb_project: "midas-dflash2"
  log_every_steps: 50
