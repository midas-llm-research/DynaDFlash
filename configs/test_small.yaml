target_model: "Qwen/Qwen3-4B"
draft_checkpoint: "z-lab/Qwen3-4B-DFlash-b16"
data_path: "/checkpoints/sdd/sdd_100k.jsonl"

router:
  hidden_size: 2560
  num_layers: 5
  rank: 128
  gamma_init: 0.01
  temperature_init: 1.0

training:
  lr: 6.0e-4
  weight_decay: 0.01
  num_epochs: 1
  batch_size: 4
  gradient_accumulation_steps: 1
  max_seq_len: 1024
  block_size: 16
  max_num_anchors: 32
  warmup_ratio: 0.04
  grad_clip: 1.0
  loss_gamma: 7.0
  entropy_reg_weight: 0.01

checkpointing:
  save_every_steps: 250
  save_dir: "/checkpoints/midas-test-v3"
  keep_last_n: 2

logging:
  wandb_project: "midas-test-run"
  log_every_steps: 10
  eval_every_steps: 50
