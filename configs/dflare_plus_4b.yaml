target_model: "Qwen/Qwen3-4B"
draft_checkpoint: "z-lab/Qwen3-4B-DFlash-b16"
data_path: "/checkpoints/sdd/sdd_100k.jsonl"

# DFlare+ : DFlare + shrunk MLP + more layers + per-layer token mixing.
# Architecture is identical to dflare_deep_4b.yaml, so dflare-plus vs
# dflare-deep isolates token mixing as the single variable. Training block is
# byte-identical to dflare_4b.yaml / dflare_deep_4b.yaml for comparability.
dflare_plus:
  hidden_size: 2560
  num_draft_layers: 9
  num_target_layers: 9
  gamma_initial: 4.5
  gamma_increment_per_epoch: 1.0
  intermediate_size: 4864

training:
  lr: 6.0e-4
  weight_decay: 0.01
  num_epochs: 3
  batch_size: 4
  gradient_accumulation_steps: 8
  max_seq_len: 3072
  block_size: 16
  max_num_anchors: 128
  warmup_ratio: 0.04
  grad_clip: 1.0
  loss_gamma: 7.0

checkpointing:
  save_every_steps: 500
  save_dir: "/checkpoints/dflare-plus-qwen3-4b"
  keep_last_n: 3

logging:
  wandb_project: "dflare-plus"
  log_every_steps: 50
