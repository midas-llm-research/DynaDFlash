[project]
name = "midas"
version = "0.1.0"
description = "MoE-inspired dynamic context routing for DFlash speculative decoding"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.57.0",
    "accelerate",
    "datasets",
    "wandb",
    "pyyaml",
    "numpy",
    "tqdm",
    "loguru",
]

[project.optional-dependencies]
modal = ["modal"]
dev = ["pytest"]

[tool.pytest.ini_options]
markers = [
    "model: base DFlash model tests",
    "router: context router tests",
    "data: data pipeline tests",
    "train: training loop tests",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
