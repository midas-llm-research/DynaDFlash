[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dynadflash"
version = "0.1.0"
description = "DFlash baseline and DynaDFlash training and evaluation"
requires-python = ">=3.11"
dependencies = [
    "torch==2.9.1",
    "transformers==5.14.1",
    "numpy==2.5.4",
    "safetensors==0.8.0",
    "huggingface_hub==1.33.0",
    "accelerate==1.15.0",
]

[project.optional-dependencies]
modal = ["modal"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["dynamic_dflash*"]
